{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Bloqueado</title>
    <link rel="stylesheet" href="{% static 'css/tu-estilo.css' %}">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 2rem 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }

        .card h1 {
            color: #c0392b;
            margin-bottom: 1rem;
        }

        .card p {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .card .timer {
            font-weight: bold;
            color: #e74c3c;
        }

        .card a {
            display: inline-block;
            margin-top: 1rem;
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Acceso Bloqueado</h1>
        <p>Has excedido el número de intentos permitidos.</p>
        {% if remaining %}
            <p>Intenta nuevamente en <span class="timer">{{ remaining }}</span> segundos.</p>
        {% else %}
            <p>Por favor espera un momento antes de intentar de nuevo.</p>
        {% endif %}
        <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
